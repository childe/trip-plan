[project]
name = "tripplan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40", "httpx>=0.27"]

[project.optional-dependencies]
# >=3.13 是实测过的下限，不是猜的——两个理由都要成立，缺一不可：
# 1) OpenAIBackend.chat() 发 max_completion_tokens，chat.completions.create()
#    是显式关键字签名，旧版本收到不认识的关键字会直接抛 TypeError（该参数
#    是 1.45 前后才进 SDK 的）；TypeError 既不是 ProviderError 也不是
#    LimitExceeded，会穿过 backend 的两条 except，落到 orchestrator.py:254
#    的 _safe_slot，把已生成的 itinerary/facts 硬编码丢成 None。
# 2) test_admin_key_alone_is_accepted 依赖的 OPENAI_ADMIN_KEY 凭据通道是 3.x
#    才有的；我们没有离线证据判定它具体从哪个次版本开始存在，所以只声明
#    实测验证过的版本（3.13），不声明一个没验证过的更低下限（比如只满足
#    第一条理由的 1.45）。
openai = ["openai>=3.13"]
web = ["flask>=3", "waitress>=3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "black>=24",
    "openai>=3.13",
    "flask>=3",
    "waitress>=3",
]

[project.scripts]
trip = "tripplan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripplan"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: 需要真实网络或真实 LLM，默认不跑"]
addopts = "-m 'not slow'"
